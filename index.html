<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Loopback</title>
    <meta name="description" content="Every eight seconds, time loops. Everything you did comes back. A game where the only enemy is you." />
    <meta name="theme-color" content="#f3eee2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3eee2'/%3E%3Ccircle cx='12' cy='16' r='9' fill='%23ef4a25'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%232b4fd8' style='mix-blend-mode:multiply'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main id="stage" data-testid="stage">
      <canvas id="game" aria-label="The Loopback arena"></canvas>

      <div id="hint" role="status" data-testid="hint"></div>

      <section id="title" class="overlay" data-testid="title">
        <h1 class="wordmark" aria-label="Loopback">L<i class="o red"></i><i class="o blue"></i>PBACK</h1>
        <p class="pitch">Every eight seconds, time loops.<br />Everything you did comes back.</p>
        <div class="actions">
          <button id="play" class="primary" data-testid="play">Play <kbd>Enter</kbd></button>
        </div>
        <p id="title-meta" class="meta" data-testid="title-meta"></p>
      </section>

      <section id="pause" class="overlay" hidden data-testid="pause">
        <h2>Paused</h2>
        <div class="actions">
          <button id="resume" class="primary">Resume <kbd>Esc</kbd></button>
          <button id="quit">Quit <kbd>Q</kbd></button>
        </div>
        <p class="meta">M turns the sound on or off. R starts over.</p>
      </section>

      <section id="over" class="panel" hidden data-testid="over">
        <div class="result">
          <p class="headline" data-testid="over-headline"></p>
          <p class="stats" data-testid="over-stats"></p>
          <p class="verdict" data-testid="over-verdict"></p>
        </div>
        <div class="actions">
          <button id="again" class="primary" data-testid="again">Again <kbd>Enter</kbd></button>
          <button id="save-print" data-testid="save-print">Save print</button>
          <button id="copy-link" data-testid="copy-link">Copy replay link</button>
        </div>
      </section>

      <div id="replay-bar" hidden data-testid="replay-bar">
        <button data-speed="1" class="chip">1x</button>
        <button data-speed="2" class="chip">2x</button>
        <button data-speed="4" class="chip">4x</button>
        <button id="exit-replay" class="chip">Exit</button>
      </div>

      <div id="toast" role="status" data-testid="toast"></div>
    </main>
    <noscript>Loopback is a game, so it needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
